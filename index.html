<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Storeys</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#F3F6F7;--ink:#1D2830;--muted:#5E6B73;--line:#D3DBDF;--sky:#D6E8EF;--sky2:#EEF6F9;--hoard:#2F6B4F;--crane:#E8862A;--card:#FFFFFF;--scaff:#9AA6AD;--bad:#B4442F;--good:#2F6B4F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#121A1F;--ink:#E7EEF1;--muted:#93A2AA;--line:#2A363D;--sky:#1B2C35;--sky2:#16232A;--card:#18232A;--scaff:#5C6B73;--hoard:#5FB08A;--good:#5FB08A;--bad:#E07A62}}
:root[data-theme="dark"]{--paper:#121A1F;--ink:#E7EEF1;--muted:#93A2AA;--line:#2A363D;--sky:#1B2C35;--sky2:#16232A;--card:#18232A;--scaff:#5C6B73;--hoard:#5FB08A;--good:#5FB08A;--bad:#E07A62}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 48px}
h1,h2,.num{font-family:"Bricolage Grotesque",system-ui,sans-serif}
header h1{font-size:2.4rem;font-weight:800;letter-spacing:-.02em;margin:8px 0 2px;line-height:1}
header p{margin:0 0 18px;color:var(--muted)}
input{font:inherit;width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--crane);outline-offset:2px}
.sugg{list-style:none;margin:6px 0 0;padding:0;background:var(--card);border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.sugg:empty{display:none}
.pick{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:none;border:0;border-bottom:1px solid var(--line);padding:12px 14px;cursor:pointer}
.sugg li:last-child .pick{border-bottom:0}
.pick:hover{background:var(--sky2)}
.pick small{display:block;color:var(--muted)}
.tag{display:inline-block;font-size:.75rem;padding:1px 7px;border-radius:99px;background:var(--sky2);color:var(--muted);margin-left:6px;vertical-align:2px}
.hint{font-size:.85rem;color:var(--muted);min-height:1.3em;margin:8px 0 18px}
.site{background:var(--card);border:1.5px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:22px}
.scene{background:linear-gradient(var(--sky2),var(--sky));padding:16px 0 0;display:flex;justify-content:center}
.scene svg{display:block;max-width:100%;height:auto}
.body{padding:16px 18px 18px}
.body h2{font-size:1.45rem;font-weight:800;margin:0;line-height:1.15}
.addr{color:var(--muted);font-size:.9rem;margin:2px 0 14px}
.storey{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.storey .num{font-size:3rem;font-weight:800;line-height:1;letter-spacing:-.03em}
.storey span{color:var(--muted)}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:6px 0 16px}
.bar i{display:block;height:100%;background:var(--hoard)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin:0 0 14px}
.facts div{font-size:.85rem;color:var(--muted)}
.facts b{display:block;font-size:1.05rem;color:var(--ink)}
.verdict{padding:12px 14px;border-radius:10px;border-left:5px solid var(--muted);background:var(--sky2);margin-bottom:14px}
.verdict.ahead{border-color:var(--good)}.verdict.behind{border-color:var(--bad)}
.verdict b{display:block}
.note{font-size:.85rem;color:var(--muted);margin:0}
.row{display:flex;justify-content:flex-end;margin-top:12px}
.maplink{font:inherit;color:var(--ink);text-decoration:none;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;margin-right:auto}
.ghost{font:inherit;cursor:pointer;background:transparent;color:var(--muted);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.src{font-size:.8rem;color:var(--muted);margin-top:28px}
@media (prefers-reduced-motion:no-preference){.fl{animation:rise .45s ease-out both}@keyframes rise{from{opacity:0}}}
</style></head>
<body><div class="wrap">
<header><h1>Storeys</h1><p>Key in your BTO or condo: project name, street, block or postal code.</p></header>
<input type="text" id="q" placeholder="e.g. Sembawang Brook, Lentor Mansion, 750437" autocomplete="off" aria-label="Project, address or postal code">
<ul class="sugg" id="sugg"></ul>
<p class="hint" id="hint"></p>
<main id="list"></main>
<p class="src">BTO dates and announced delays: BTO HQ TOP tracker. BTO blocks and postal codes: OneMap. Condo launch and expected TOP: EdgeProp developer listings. Refreshed automatically every day, last at <span id="upd">…</span>.</p>
</div>
<script>
let P=[],tracked=[];
fetch("data.json?"+Date.now()).then(r=>r.json()).then(D=>{
const BTO=D.bto,CONDO=D.condo;
document.getElementById("upd").textContent=D.updated;

BTO.forEach(r=>P.push({kind:"BTO",name:r[0],launch:r[2],ecd:r[3],delayed:r[4],remark:r[5],roads:r[6]?r[6].split("|"):[],blks:r[7]?r[7].split(" "):[],postals:r[8]?r[8].split(" "):[],addr:""}));
CONDO.forEach(r=>P.push({kind:"Condo",name:r[0],launch:r[1],ecd:r[2],delayed:"",remark:"",roads:[],blks:[],postals:(r[3].match(/\b\d{6}\b/g)||[]),addr:r[3]}));
P.forEach((p,i)=>{p.i=i;p.key=p.kind+":"+p.name+":"+p.launch});
const KEY="storeys.tracked.v4";
try{tracked=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(tracked))}catch(e){}}
const $=s=>document.querySelector(s);
const ym=s=>{if(!s)return null;const a=s.split("-").map(Number);return new Date(a[0],a[1]-1,1)};
const months=(a,b)=>(b-a)/(864e5*30.44);
const fmtYM=d=>d?d.toLocaleDateString("en-SG",{month:"short",year:"numeric"}):"Not announced";
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const title=s=>s.toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase());
const PASTELS=["#F2C6B4","#BFD8C9","#F3DFA2","#C7D3EC","#E9C3D3","#CFE3D9"];
const hash=s=>[...s].reduce((h,c)=>(h*31+c.charCodeAt(0))>>>0,7);
const norm=s=>s.toUpperCase().replace(/[’']/g,"").replace(/\b(BLK|BLOCK)\b/g," ").replace(/\bAVE\b/g,"AVENUE").replace(/\bST\b/g,"STREET").replace(/\bRD\b/g,"ROAD").replace(/\bDR\b/g,"DRIVE").replace(/\bCRES\b/g,"CRESCENT").replace(/[^A-Z0-9@ ]/g," ").replace(/\s+/g," ").trim();
P.forEach(p=>{p.nn=norm(p.name);p.na=norm(p.addr+" "+p.roads.join(" "))});

function search(q){
  const n=norm(q); if(n.length<2)return[];
  const toks=n.split(" ").filter(t=>t.length>2&&!/^\d+$/.test(t));
  const postal=(n.match(/\b\d{6}\b/)||[])[0];
  const blk=(n.match(/\b\d{1,4}[A-Z]?\b/)||[])[0];
  return P.map(p=>{
    let s=0;
    if(postal&&p.postals.includes(postal))s+=100;
    if(p.nn.startsWith(n))s+=60; else if(p.nn.includes(n))s+=40;
    if(p.roads.some(r=>n.includes(r))){s+=25;if(blk&&p.blks.includes(blk))s+=50;}
    const words=p.nn.split(" ");
    s+=toks.filter(t=>words.includes(t)).length*10;
    s+=toks.filter(t=>p.na.split(" ").includes(t)).length*6;
    return{p,s};
  }).filter(x=>x.s>=10).sort((a,b)=>b.s-a.s).slice(0,6).map(x=>x.p);
}

function stats(p){
  const L=ym(p.launch),E=ym(p.ecd),T=ym(p.delayed||p.ecd),now=new Date();
  if(!L)return{L,E,T,pct:null,rate:null,left:T?Math.max(0,Math.round(months(now,T))):null,delay:0};
  const total=months(L,T);
  const pct=Math.max(0,Math.min(100,months(L,now)/total*100));
  return{L,E,T,pct,rate:100/total,left:Math.max(0,Math.round(months(now,T))),delay:p.delayed?Math.round(months(E,T)):0};
}
function stageFor(p){return p==null?"Not started":p<12?"Piling and foundations":p<70?"Superstructure going up":p<92?"Facade and fit-out":p<100?"Final checks before TOP":"Due for completion"}

function building(pct,name){
  const N=20,fh=13,W=150,x0=85,ground=40+N*fh+20,H=ground+26;
  const built=Math.round(N*(pct||0)/100),facade=PASTELS[hash(name)%PASTELS.length];
  let g=`<rect x="${x0}" y="${ground-N*fh}" width="${W}" height="${N*fh}" fill="none" stroke="var(--scaff)" stroke-dasharray="4 4" stroke-width="1.2"/>`;
  for(let i=1;i<N;i++)g+=`<line x1="${x0}" x2="${x0+W}" y1="${ground-i*fh}" y2="${ground-i*fh}" stroke="var(--scaff)" stroke-opacity=".35" stroke-dasharray="2 5"/>`;
  for(let i=0;i<built;i++){
    const y=ground-(i+1)*fh,band=i%6<3?facade:"#FBFBF8";
    g+=`<g class="fl" style="animation-delay:${i*25}ms"><rect x="${x0}" y="${y}" width="${W}" height="${fh}" fill="${band}" stroke="#00000022" stroke-width=".6"/>`;
    for(let k=0;k<8;k++)g+=`<rect x="${x0+8+k*17.5}" y="${y+fh*.28}" width="9" height="${fh*.44}" fill="#3E5663" opacity=".55"/>`;
    g+=`</g>`;
  }
  if((pct||0)<100){
    const top=ground-built*fh,cx=x0+W-28,mt=Math.max(14,top-70),hook=Math.min(top-6,mt+50);
    g+=`<g stroke="var(--crane)" stroke-width="3" fill="none" stroke-linecap="round"><line x1="${cx}" y1="${ground}" x2="${cx}" y2="${mt}"/><line x1="${cx-110}" y1="${mt+6}" x2="${cx+40}" y2="${mt+6}"/><line x1="${cx}" y1="${mt-10}" x2="${cx-110}" y2="${mt+6}" stroke-width="1.5"/><line x1="${cx}" y1="${mt-10}" x2="${cx+40}" y2="${mt+6}" stroke-width="1.5"/><line x1="${cx-80}" y1="${mt+6}" x2="${cx-80}" y2="${hook}" stroke-width="1.2" stroke="var(--ink)"/></g><rect x="${cx+28}" y="${mt+6}" width="14" height="10" fill="var(--crane)"/><rect x="${cx-88}" y="${hook}" width="16" height="6" fill="var(--ink)"/>`;
  }
  g+=`<rect x="0" y="${ground}" width="320" height="26" fill="var(--hoard)"/>`;
  for(let k=0;k<11;k++)g+=`<line x1="${k*32}" x2="${k*32}" y1="${ground}" y2="${ground+26}" stroke="#ffffff33"/>`;
  g+=`<circle cx="40" cy="${ground-14}" r="14" fill="#5E9B6E"/><rect x="38" y="${ground-6}" width="4" height="6" fill="#4B3B2A"/>`;
  return `<svg viewBox="0 0 320 ${H}" width="320" role="img" aria-label="Illustration of the building about ${Math.round(pct||0)} percent built">${g}</svg>`;
}

function verdict(p,k){
  if(k.pct==null)return{cls:"",t:"Not launched yet",d:`Expected TOP ${fmtYM(k.T)}. Progress starts counting once it launches.`};
  if(k.pct>=100)return{cls:"ahead",t:"Due now",d:`Completion date of ${fmtYM(k.T)} has arrived.`};
  if(k.delay>=1){
    const why=p.remark?p.remark.replace(/\s*\d{4}-\d{2}-\d{2}$/,"").replace("Covid19:","Covid-19:").replace(/month(s)?\(s\)/,"months")+".":"";
    return{cls:"behind",t:`About ${k.delay} months behind the original date`,d:`Launched with completion in ${fmtYM(k.E)}, now ${fmtYM(k.T)}. ${why}`};
  }
  return{cls:"ahead",t:"On schedule",d:p.kind==="BTO"?`No delay announced by HDB. Completion expected ${fmtYM(k.T)}.`:`Developer's expected TOP is ${fmtYM(k.T)}.`};
}

function card(p){
  const k=stats(p),v=verdict(p,k);
  let where=p.kind==="BTO"?(p.blks.length?"Blk "+p.blks.slice().sort((a,b)=>parseInt(a)-parseInt(b)||a.localeCompare(b)).join(", ")+", "+p.roads.map(title).join(" / "):"Block numbers not on OneMap yet"):(p.addr||"Address not listed");
  if(where.length>140)where=where.slice(0,137)+"…";
  return `<section class="site"><div class="scene">${building(k.pct,p.name)}</div><div class="body">
    <h2>${esc(p.name)}<span class="tag">${p.kind}</span></h2><p class="addr">${esc(where)}</p>
    <div class="storey"><span class="num">${k.pct==null?"—":Math.round(k.pct)+"%"}</span><span>of the way to completion</span></div>
    <div class="bar"><i style="width:${k.pct||0}%"></i></div>
    <div class="verdict ${v.cls}"><b>${esc(v.t)}</b>${esc(v.d)}</div>
    <div class="facts">
      <div>Pace<b>${k.rate?k.rate.toFixed(1)+"% a month":"—"}</b></div>
      <div>Time left<b>${k.left?k.left+" months":"—"}</b></div>
      <div>Launched<b>${fmtYM(k.L)}</b></div>
      <div>${p.kind==="BTO"?"Completion":"Expected TOP"}<b>${fmtYM(k.T)}</b></div>
      <div>Stage now<b>${stageFor(k.pct)}</b></div>
    </div>
    <p class="note">Percentage is time elapsed from launch to ${p.kind==="BTO"?"HDB's estimated completion date":"the developer's expected TOP"}.</p>
    <div class="row"><a class="maplink" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name+(p.kind==="BTO"?" BTO ":" ")+"Singapore")}">See site on Google Maps</a><button class="ghost" type="button" data-del="${esc(p.key)}">Remove</button></div>
  </div></section>`;
}
function render(){
  const items=tracked.map(key=>P.find(p=>p.key===key)).filter(Boolean);
  $("#list").innerHTML=items.length?items.map(card).join(""):`<div class="empty"><p>Start typing above and tap your project.</p></div>`;
}
function pick(i){
  const p=P[i];if(!p)return;
  tracked=[p.key,...tracked.filter(x=>x!==p.key)];save();render();
  $("#q").value="";$("#sugg").innerHTML="";$("#hint").textContent="";
  $("#list").scrollIntoView({behavior:"smooth",block:"start"});
}
const q=$("#q"),sug=$("#sugg");
q.addEventListener("input",()=>{
  const r=search(q.value);
  sug.innerHTML=r.map(p=>`<li><button type="button" class="pick" data-i="${p.i}">${esc(p.name)}<span class="tag">${p.kind}</span><small>${esc(p.kind==="BTO"?(p.roads.map(title).join(" / ")||"Completion "+fmtYM(ym(p.delayed||p.ecd))):(p.addr?p.addr.slice(0,60):"Expected TOP "+fmtYM(ym(p.ecd))))}</small></button></li>`).join("");
  $("#hint").textContent=q.value.trim().length>3&&!r.length?"No match. Try the project name. Covers BTOs launched since Nov 2020 and condos with a published expected TOP.":"";
});
q.addEventListener("keydown",e=>{if(e.key==="Enter"){const b=sug.querySelector(".pick");if(b)pick(+b.dataset.i);}});
sug.addEventListener("click",e=>{const b=e.target.closest(".pick");if(b)pick(+b.dataset.i);});
$("#list").addEventListener("click",e=>{const d=e.target.closest("[data-del]");if(d){tracked=tracked.filter(x=>x!==d.dataset.del);save();render();}});
render();
}).catch(()=>{document.querySelector("#list").innerHTML=`<div class="empty"><p>Couldn't load the latest data. Refresh the page to try again.</p></div>`;});
</script></body></html>
